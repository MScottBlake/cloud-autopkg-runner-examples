name: AutoPkg Run via Python

on:
  # schedule:
  #   - cron: "0 0 * * *"  # Adjust schedule as needed
  workflow_dispatch:  # Enables manual triggering

jobs:
  autopkg-run:
    runs-on: macos-latest
    env:
      MUNKI_VERSION: 7.0.10
      MUNKI_EXPLICIT_VERSION: 7.0.10.5496
      AUTOPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APKG_VERSION: 2.9.0 # 'AUTOPKG_' gets injected as an env var
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for accurate diffs

      - name: Setup Cache
        uses: actions/cache@v5
        with:
          path: metadata_cache.json
          key: metadata_cache-${{ github.run_id }}
          restore-keys: metadata_cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.APKG_VERSION }}/autopkg-${{ env.APKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: AutoPkg Repo Add
        run: |
          cat "AutoPkg/autopkg_repo_list.txt" | xargs autopkg repo-add

      - name: Run AutoPkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run examples/git_worktree_example.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
            Munki
